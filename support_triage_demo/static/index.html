<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support Ticket Triage</title>
<style>
  :root { --ink:#16202c; --muted:#5b6878; --line:#dfe4ea; --bg:#f4f6f9; --card:#fff; --accent:#1f5fbf;
          --ok:#1d7a46; --okbg:#e6f4ec; --bad:#b42318; --badbg:#fdecea; --warn:#8a5a00; --warnbg:#fff4d6; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  header { display:flex; align-items:center; gap:14px; padding:10px 20px; background:#0f1b2d; color:#fff; }
  header h1 { font-size:17px; margin:0; font-weight:600; }
  header .sub { color:#b8c4d6; font-size:13px; }
  .sim { background:#ffcc00; color:#1a1a1a; font-weight:800; letter-spacing:.04em; padding:3px 9px; border-radius:4px; font-size:12px; }
  .spacer { flex:1; }
  main { display:grid; grid-template-columns:300px 1fr; gap:14px; padding:14px 20px; height:calc(100vh - 50px); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; overflow:auto; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 8px; }
  .ticket { display:block; width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:6px;
            padding:7px 9px; margin-bottom:6px; cursor:pointer; font:inherit; color:inherit; }
  .ticket:hover { border-color:#9db6dc; }
  .ticket.active { border-color:var(--accent); box-shadow:0 0 0 2px #d6e4fa; }
  .ticket .id { font-weight:600; font-size:12px; color:var(--muted); }
  .ticket .subj { font-weight:600; }
  .chip { display:inline-block; font-size:11px; font-weight:600; padding:1px 7px; border-radius:10px; background:#eef1f5; color:var(--muted); }
  .chip.routed { background:var(--okbg); color:var(--ok); }
  .chip.needs_review { background:var(--warnbg); color:var(--warn); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  select, button { font:inherit; padding:6px 10px; border-radius:6px; border:1px solid #c5cdd8; background:#fff; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  button.primary:disabled { opacity:.5; cursor:default; }
  .body { background:#f8fafc; border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin:6px 0 10px; }
  .contract { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin:10px 0; }
  .field { border:1px solid var(--line); border-radius:6px; padding:6px 9px; }
  .field .k { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .field .v { font-weight:700; font-size:15px; }
  .reason { color:var(--ink); margin:0 0 8px; }
  .alert { border-radius:6px; padding:8px 10px; margin:8px 0; font-weight:600; }
  .alert.bad { background:var(--badbg); color:var(--bad); border:1px solid #f5c2bd; }
  .alert.warn { background:var(--warnbg); color:var(--warn); border:1px solid #f0d58a; }
  .alert.ok { background:var(--okbg); color:var(--ok); border:1px solid #b5dec6; }
  .muted { color:var(--muted); }
  .hidden { display:none; }
</style>
</head>
<body>
<header>
  <h1>Juniper &amp; Pine Outfitters <span class="sub">(fictional retailer) · Support ticket triage</span></h1>
  <span class="spacer"></span>
  <span class="sim" id="sim-banner">SIMULATED PROVIDER · SYNTHETIC TICKETS · OFFLINE</span>
</header>
<main>
  <section class="card">
    <h2>Inbox (synthetic)</h2>
    <div id="inbox"></div>
  </section>
  <section class="card" id="workbench">
    <h2>Triage</h2>
    <div id="ticket-view" class="muted">Select a ticket.</div>
    <div class="row">
      <label for="provider">Provider</label>
      <select id="provider"></select>
      <button class="primary" id="triage" disabled>Triage ticket</button>
    </div>
    <div id="result" class="hidden">
      <div id="error" class="alert bad hidden"></div>
      <div class="contract">
        <div class="field"><div class="k">Queue</div><div class="v" id="r-queue"></div></div>
        <div class="field"><div class="k">Priority</div><div class="v" id="r-priority"></div></div>
        <div class="field"><div class="k">Review required</div><div class="v" id="r-review"></div></div>
        <div class="field"><div class="k">Status</div><div class="v" id="r-status"></div></div>
      </div>
      <p class="reason"><span class="muted">Reason:</span> <span id="r-reason"></span></p>
      <div id="review" class="alert warn hidden">
        <div style="margin-bottom:6px">Human review required before routing.</div>
        <div class="row">
          <label for="review-queue">Route to</label>
          <select id="review-queue"></select>
          <button class="primary" id="approve">Confirm route</button>
        </div>
      </div>
      <div id="routed" class="alert ok hidden"></div>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let config = null, tickets = [], selected = null;

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === 'class' ? node.className = v : node.setAttribute(k, v);
  for (const c of children) node.append(c);
  return node;
}
function statusLabel(state) {
  if (state.status === 'routed') return `Routed: ${state.routed_to}`;
  if (state.status === 'needs_review') return 'Needs review';
  return 'New';
}
function renderInbox() {
  const box = $('inbox'); box.replaceChildren();
  for (const t of tickets) {
    const btn = el('button', {class: 'ticket' + (t.id === selected ? ' active' : ''), 'data-id': t.id},
      el('div', {class: 'row'}, el('span', {class: 'id'}, t.id), el('span', {class: 'chip ' + t.state.status}, statusLabel(t.state))),
      el('div', {class: 'subj'}, t.subject));
    btn.onclick = () => select(t.id);
    box.append(btn);
  }
}
function select(id) {
  selected = id;
  const t = tickets.find((x) => x.id === id);
  $('ticket-view').replaceChildren(el('div', {}, el('b', {}, `${t.id} · ${t.subject}`), ' ', el('span', {class: 'muted'}, t.customer)),
    el('div', {class: 'body'}, t.body));
  $('ticket-view').classList.remove('muted');
  $('triage').disabled = false;
  renderInbox();
  t.state.triage ? showState(t.state) : $('result').classList.add('hidden');
}
function showState(state) {
  const rec = state.triage, r = rec.result;
  $('result').classList.remove('hidden');
  $('r-queue').textContent = r.queue; $('r-priority').textContent = r.priority;
  $('r-review').textContent = r.review_required ? 'yes' : 'no';
  $('r-status').textContent = statusLabel(state);
  $('r-reason').textContent = r.reason;
  $('error').classList.toggle('hidden', !rec.error);
  $('error').textContent = rec.error ? `FAIL-SAFE: ${rec.provider.label} — ${rec.error}. Routed to human review; no other provider was tried.` : '';
  $('review').classList.toggle('hidden', state.status !== 'needs_review');
  $('review-queue').value = config.queues.includes(r.queue) ? r.queue : config.queues[0];
  $('routed').classList.toggle('hidden', state.status !== 'routed');
  $('routed').textContent = state.status === 'routed' ? `Routed to ${state.routed_to} (${state.routed_by}).` : '';
}
async function refresh() { tickets = await api('/api/tickets'); renderInbox(); }
$('triage').onclick = async () => {
  $('triage').disabled = true;
  try {
    const state = await api('/api/triage', {ticket_id: selected, provider: $('provider').value});
    await refresh(); showState(state);
  } catch (e) { alert(e.message); } finally { $('triage').disabled = false; }
};
$('approve').onclick = async () => {
  const state = await api('/api/review', {ticket_id: selected, queue: $('review-queue').value});
  await refresh(); showState(state);
};
(async () => {
  config = await api('/api/config');
  for (const p of config.providers) $('provider').append(el('option', {value: p.id}, p.label));
  for (const q of config.queues) $('review-queue').append(el('option', {value: q}, q));
  await refresh();
})();
</script>
</body>
</html>
